[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "volatilitylab"
version = "0.1.0"
description = "Quantitative Options Pricing, Volatility Forecasting & Risk Analytics"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "VolatilityLab Contributors" }
]
keywords = [
    "options",
    "derivatives",
    "quantitative-finance",
    "volatility",
    "black-scholes",
    "monte-carlo",
    "greeks",
    "risk-analytics"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "polars>=0.20.0",
    "pyarrow>=15.0.0",
    "yfinance>=0.2.36",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.98.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]
ml = [
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "statsmodels>=0.14.0",
    "arch>=6.2.0",
]
all = [
    "volatilitylab[dev,ml]",
]

[project.urls]
Homepage = "https://github.com/pabloapcv/volatility-lab"
Documentation = "https://github.com/pabloapcv/volatility-lab#readme"
Repository = "https://github.com/pabloapcv/volatility-lab"

[tool.hatch.build.targets.wheel]
packages = ["src/volatilitylab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "numerical: marks tests that verify numerical accuracy",
    "integration: marks integration tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/volatilitylab"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
fail_under = 50
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "NPY", # numpy-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["volatilitylab"]

[tool.ruff.lint.per-file-ignores]
# Tests pin np.random.seed for reproducibility; switching to Generator would change draws.
"tests/**" = ["NPY002"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "yfinance.*",
    "scipy.*",
]
ignore_missing_imports = true
